# Marketplace freshness guard — the committed plugin output (.claude-plugin/ + plugins/)
# is generated from skills/ + packs/ + skills.json by scripts/build-plugins.mjs.
# This job rebuilds and fails if the committed output is stale, so a skill or pack
# change can never merge without regenerated plugins.
name: marketplace

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packs/**"
      - "skills.json"
      - "scripts/build-plugins.mjs"
      - "plugins/**"
      - ".claude-plugin/**"
      - "LICENSE"
      - "tests/afx-marketplace.test.mjs"
      - ".github/workflows/marketplace.yml"
  pull_request:
    paths:
      - "skills/**"
      - "packs/**"
      - "skills.json"
      - "scripts/build-plugins.mjs"
      - "plugins/**"
      - ".claude-plugin/**"
      - "LICENSE"
      - "tests/afx-marketplace.test.mjs"
      - ".github/workflows/marketplace.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test marketplace packaging contracts
        run: node --test tests/afx-marketplace.test.mjs
      - name: Rebuild marketplace output
        run: node scripts/build-plugins.mjs
      - name: Assert committed output is fresh
        run: |
          if ! git diff --exit-code --stat .claude-plugin plugins; then
            echo "::error::Committed plugin output is stale. Run 'node scripts/build-plugins.mjs' and commit .claude-plugin/ + plugins/."
            exit 1
          fi
          # Catch deleted-but-still-declared or newly generated untracked files too.
          untracked=$(git ls-files --others --exclude-standard .claude-plugin plugins)
          if [ -n "$untracked" ]; then
            echo "::error::Generated files are untracked: $untracked"
            exit 1
          fi
      - name: Install Claude manifest validator
        run: npm install --global @anthropic-ai/claude-code@2.1.304
      - name: Validate marketplace and every plugin
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/afx-claude-validation
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude plugin validate . --strict
          for plugin in plugins/*; do
            claude plugin validate "$plugin" --strict
          done
